name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: neuro
          POSTGRES_PASSWORD: neuro
          POSTGRES_DB: neuro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U neuro -d neuro_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://neuro:neuro@localhost:5432/neuro_test
      NEURO_OS_TEST_DATABASE_URL: postgresql+asyncpg://neuro:neuro@localhost:5432/neuro_test
      SECRET_KEY: ci-only-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Compile source and migrations
        run: python -m compileall -q src alembic

      - name: Run unit tests
        run: pytest -q -m "not integration"

      - name: Verify full PostgreSQL migration cycle
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          alembic check

      - name: Run PostgreSQL API integration tests
        run: pytest -q -m integration
