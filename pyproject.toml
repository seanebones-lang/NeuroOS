[project]
name = "neuro-os"
version = "0.1.0"
description = "External executive function for neurodivergent builders and shop owners"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "asyncpg>=0.29",
    "redis>=5.1",
    "httpx>=0.28",
    "openai>=1.55",
    "anthropic>=0.45",
    "google-generativeai>=0.8",
    "tenacity>=8.5",
    "structlog>=25.1",
    "python-json-logger>=2.0",
    "apscheduler>=3.11",
    "icalendar>=5.0",
    "python-multipart>=0.0.18",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "bcrypt>=4.0.1,<4.1",
    "email-validator>=2.2",
    "typer>=0.15",
    "rich>=13.9",
    "orjson>=3.10",
    "msgspec>=0.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "pre-commit>=4.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "PTH", "SIM", "T20", "TID", "TRY", "ARG", "ERA", "PD", "PL", "RET"]
ignore = ["S101", "TRY003"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires an isolated PostgreSQL database",
]

[project.scripts]
neuro-os = "neuro_os.cli:app"

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"
